spring:
  application:
    name: lovable-clone
    description: this is application
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:9010/pgvector-test}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
      chat:
        options:
          model: ${CHAT_MODEL_IN_USE:nvidia/nemotron-3.5-lightning:free}
          temperature: 0.0

jwt:
  secret-key: ${JWT_SECRET_KEY}

stripe:
  api:
    secret: ${STRIPE_API_SECRET}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

client.url: ${CLIENT_URL:http://localhost:8080}

logging:
  level:
    org.springframework.ai.chat.client: DEBUG

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  project-bucket: ${MINIO_PROJECT_BUCKET:projects}
