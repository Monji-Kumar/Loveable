services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:9010:5432"
    environment:
      POSTGRES_DB: pgvector-test
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pgvector-test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
